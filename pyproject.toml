[project]
name = "bandu"
version = "0.1.0"
description = "Agentic framework for robotics applications, built on top of LangChain and RAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.11.1",
    "fastmcp[tasks]>=3.4.4",
    "google-adk[a2a]>=2.5.0",
    "langchain-chroma>=0.2.2",
    "langchain-core>=0.3.86",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=1.0.1",
    "posthog>=7.25.0",
    "pydantic>=2.13.4",
    "rai-core>=2.11.2",
    "rai-perception>=0.3.0",
    # "rai-whoami>=0.0.5",
]

[project.scripts]
start_navigation_agent = "bandu.a2a_agents.navigation_agent.__main__:main"
start_manipulation_agent = "bandu.a2a_agents.manipulation_agent.__main__:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
]
